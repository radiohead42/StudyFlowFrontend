
<section class="task-create-page">

  <header class="page-header">
    <h1>Nueva tarea</h1>
    <p>Crear una nueva tarea y asignala a una materia.</p>
  </header>

  <mat-card class="form-card">

    <mat-card-content>

      <form class="task-form" (ngSubmit)="create()">

        <mat-form-field appearance="outline">

          <mat-label>Título</mat-label>
          <input matInput type="text" name="title" [(ngModel)]="title" required>

        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descripción</mat-label>
          <textarea matInput name="description" [(ngModel)]="description"></textarea>

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>Fecha límite</mat-label>
          <input matInput [matDatepicker]="picker" name="dueDate" [(ngModel)]="dueDate" required>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>Prioridad</mat-label>

          <mat-select name="priority" [(ngModel)]="priority">

            <mat-option value="Low">Baja</mat-option>

            <mat-option value="Medium">Media</mat-option>

            <mat-option value="High">Alto</mat-option>

          </mat-select>

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>Materia</mat-label>

          <mat-select name="subjectId" [(ngModel)]="subjectId" required>

            @for (subject of subjects(); track subject.id) {
            <mat-option [value]="subject.id">
              {{ subject.name }}
            </mat-option>
            }

          </mat-select>

        </mat-form-field>

        @if (error) {
        <p>{{ error }}</p>
        }

        <div class="actions">

          <a mat-button routerLink="/tasks">Cancelar</a>
          <button mat-flat-button type="submit">Crear tarea</button>

        </div>

      </form>

    </mat-card-content>

  </mat-card>

</section>
