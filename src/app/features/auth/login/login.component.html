
<div class="login-page">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>StudyFlow</mat-card-title>
      <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form (ngSubmit)="login()">

        <mat-form-field appearance="outline">

          <mat-label>Correo</mat-label>

          <input matInput type="email" name="email" [(ngModel)]="email" required>

        </mat-form-field>

        <mat-form-field appearance="outline">

          <mat-label>Contraseña:</mat-label>

          <input matInput type="password" name="password" [(ngModel)]="password" required>

        </mat-form-field>

        <button mat-flat-button type="submit">Iniciar sesión</button>

      </form>

      <p>{{ message }}</p>
      <p>{{ error }}</p>

      <p class="auth-link">
      ¿No tienes una cuenta?
      <a routerLink="/register">
        Regístrate
      </a>
      </p>

    </mat-card-content>

  </mat-card>

</div>
